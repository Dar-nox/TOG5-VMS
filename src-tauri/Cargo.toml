[package]
name = "tog5-vms"
version = "0.3.0"
description = "TOG 5 VMS desktop shell"
authors = ["TOG 5 VMS"]
edition = "2021"

[lib]
name = "tog5_vms_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Just Tauri. SQLite, serde and the file opener were all in service of a local
# database and local photo folders, none of which exist any more.
[dependencies]
tauri = { version = "2", features = [] }
