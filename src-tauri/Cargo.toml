[package]
name = "tog5-vms"
version = "0.1.0"
description = "TOG 5 VMS local desktop vehicle maintenance system"
authors = ["TOG 5 VMS"]
edition = "2021"

[lib]
name = "tog5_vms_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"
