[workspace]
members = ["crates/vms-core"]
exclude = ["src-tauri"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["TOG 5 VMS"]

[workspace.dependencies]
argon2 = "0.5"
r2d2 = "0.8"
r2d2_sqlite = "0.25"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
